# 開發用 nginx —— docker-compose.override.yml 掛這份取代 nginx.conf
#
# 跟正式版 nginx.conf 只差一件事：`location /` 不再送 web/dist 的靜態檔，
# 而是反向代理到 Vite dev server（web-dev:5173），連 HMR 的 WebSocket 一起轉。
#
# 為什麼要繞這一圈，而不是直接開 :5173？
#   因為這樣開發時的網址（:30080）跟正式環境完全一樣——同源 cookie、
#   /api 路徑、以及**附件下載的 X-Accel-Redirect** 全都照舊。
#   繞過 nginx 直連 api 的話，附件會下載到 0 bytes 而且不會報錯（部署手冊 §2）。
#
# ⚠️ 這份只給開發用。正式部署：docker compose -f docker-compose.yml up -d

upstream api {
    server api:8000;
}

# HMR 走 WebSocket：Upgrade / Connection 標頭必須原樣轉發，
# 少了這兩行前端就會停在「連得上但不會自動更新」的狀態。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # 附件 20MB + 餘裕
    client_max_body_size 25M;

    # 開發時不壓縮：Vite 送的是未打包的原始模組，壓了也只是拖慢重載
    gzip off;

    # ── API ────────────────────────────────────────────────────────
    location ~ ^/api/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # API 文件與 DRF 介面的靜態檔（api 容器啟動時 collectstatic 進 named volume）
    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
    }

    # ── 受保護的附件 ────────────────────────────────────────────────
    # 決策 T11：Django 先驗權限，再用 X-Accel-Redirect 交給 nginx 送檔。
    # 這個 location 只能內部跳轉，外部直接存取會 404。
    location /protected-media/ {
        internal;
        alias /app/media/;

        # ⚠️ X-Accel-Redirect 時 nginx 不會轉發上游設的自訂 header，
        # 這兩行必須在這裡再設一次（同 nginx.conf）
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }

    # ── 前端：全部交給 Vite dev server ──────────────────────────────
    location / {
        # 用變數 + docker 內建 DNS，讓位址在「每次請求」時才解析。
        # 寫成 upstream 的話 nginx 只在啟動時解析一次——web-dev 重啟換了 IP，
        # nginx 會一直往舊 IP 送，症狀是莫名其妙的 502。
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $vite http://web-dev:5173;
        proxy_pass $vite;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # HMR 是長連線；預設 60s 會被剪斷，之後改檔案就不會自動更新了
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # 讓 HMR 的訊息立刻送到瀏覽器，不要卡在 nginx 的緩衝區
        proxy_buffering off;
    }
}
