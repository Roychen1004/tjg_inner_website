upstream api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    # 附件 20MB + 餘裕
    client_max_body_size 25M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    # ── 前端靜態檔（帶 hash 檔名，長快取）──────────────────────────
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── API ────────────────────────────────────────────────────────
    location ~ ^/api/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Django Admin 已於 2026-09-01（D54）整個移除——維護功能全部在網站上。
    # /static/ 留著：API 文件與 DRF 介面仍會用到
    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
    }

    # ── 受保護的附件 ────────────────────────────────────────────────
    # 決策 T11：附件必須先經 Django 檢查權限，再用 X-Accel-Redirect
    # 交給 nginx 送出。這個 location 只能內部跳轉，外部直接存取會 404。
    location /protected-media/ {
        internal;
        alias /app/media/;

        # ⚠️ X-Accel-Redirect 時，nginx **不會**把 Django 設的自訂 header 帶出去
        # （Content-Disposition 會，X-Content-Type-Options 不會）。
        # 這兩行必須在這裡再設一次，否則使用者拿到的回應沒有防護——
        # 而且 Django 那邊看起來是有設的，很難發現。
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }

    # ── SPA 路由 fallback ──────────────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
