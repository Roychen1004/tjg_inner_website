# PostgreSQL 16 — 針對 8GB 主機、預估 <1GB 資料庫調參
# 見 docs/07_系統架構與開發路線圖.md §3.2

listen_addresses = '*'

# ── 記憶體 ────────────────────────────────────────────────────────────
shared_buffers = 512MB              # 熱資料幾乎全放得進來
effective_cache_size = 2GB          # 告訴查詢規劃器可用的 OS 快取
work_mem = 8MB                      # 單次排序／雜湊；× max_connections = 400MB 最壞情況
maintenance_work_mem = 128MB        # VACUUM／建索引用
max_connections = 50                # gunicorn 3 workers × 2 threads + Admin + cron

# ── WAL ───────────────────────────────────────────────────────────────
wal_buffers = 16MB
checkpoint_completion_target = 0.9
min_wal_size = 512MB
max_wal_size = 2GB

# ── SSD 假設 ──────────────────────────────────────────────────────────
random_page_cost = 1.1
effective_io_concurrency = 200

# ── 日誌 ──────────────────────────────────────────────────────────────
log_min_duration_statement = 500    # 記錄超過 500ms 的查詢
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on
log_timezone = 'Asia/Taipei'

# ── 語系 ──────────────────────────────────────────────────────────────
timezone = 'UTC'                    # 資料庫存 UTC，顯示層轉 Asia/Taipei
datestyle = 'iso, ymd'
